[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "free-agent"
version = "1.0.0"
description = "在 Linux / WSL / Windows 上快速部署白嫖 AI Agent 的跨平台工具"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Free_Agent contributors" }]
keywords = ["ai", "agent", "cli", "deployment", "wsl", "windows"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
fa = "fa.cli:main"

[tool.setuptools]
packages = ["fa"]

[tool.setuptools.data-files]
"share/free-agent" = ["catalog/tools.json"]
