name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    env:
      PYTHONUTF8: "1"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test
        run: python -m fa list --fast
      - name: Catalog docs in sync
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m fa catalog --markdown > /tmp/catalog.md
          diff -u docs/catalog.md /tmp/catalog.md
